# ============================================================================
# 小米天气接口 同源反代 —— Nginx 配置
# ----------------------------------------------------------------------------
# 解决: 小米接口跨域(CORS)且校验 User-Agent，浏览器不能直连。
# 用法: 置于 http{} 内，将 /wtr/ 路径的请求转发到小米接口 /wtr-v3/
#       前端/设备请求 https://你的域名/wtr/weather/all?xxx 即可拿到数据
# 说明: ESP32 等设备实测直连小米接口(不带UA/Referer)即可，无需此反代；
#       此配置主要供浏览器前端使用，或在小米开始封禁非浏览器UA时兜底。
# ============================================================================
location /wtr/ {
    proxy_pass https://weatherapi.market.xiaomi.com/wtr-v3/;
    proxy_ssl_server_name on;                          # HTTPS反代必须：SNI传小米域名
    proxy_set_header Host weatherapi.market.xiaomi.com; # 伪装Host为小米域名
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.0"; # 伪装浏览器UA
    proxy_set_header Referer "";                        # 清空Referer，避免带出本站域名

    proxy_connect_timeout 10s;
    proxy_read_timeout 15s;
}
